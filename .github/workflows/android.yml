name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', 'mobile/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable APK
        working-directory: android
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Bantay-Agapay.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Bantay-Agapay-Android
          path: Bantay-Agapay.apk
          retention-days: 30
      - name: Publish direct phone download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title 'Bantay-Agapay for Android' --prerelease --notes-file mobile/RELEASE_NOTES.md --target "$GITHUB_SHA"
          gh release edit android-latest --notes-file mobile/RELEASE_NOTES.md
          gh release upload android-latest Bantay-Agapay.apk --clobber
