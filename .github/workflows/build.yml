name: Build app
on:
  push:
    branches: [main, feature/client-compliance-integration-20261117]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://build-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-placeholder-service-key
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate PostgreSQL migration syntax
        run: |
          python -m pip install --disable-pip-version-check 'pglast>=6,<8'
          python scripts/check_sql_migrations.py
      - run: node --test tests/*.test.cjs
      - run: npm run type-check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          retention-days: 7

  database-regression:
    if: github.ref == 'refs/heads/feature/client-compliance-integration-20261117' || (github.event_name == 'pull_request' && github.head_ref == 'feature/client-compliance-integration-20261117')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: bantay_ephemeral_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bantay_ephemeral_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-ci-only
      PGDATABASE: bantay_ephemeral_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema to disposable database, then exercise gate transactions
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/staging_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/09_lockdown_public_visit_access.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/10_client_guardian_preregistration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/11_returning_visitor_otp.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/12_guardian_registry_operations.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/gate_transactions.sql

  browser-regression:
    if: github.ref == 'refs/heads/feature/client-compliance-integration-20261117' || (github.event_name == 'pull_request' && github.head_ref == 'feature/client-compliance-integration-20261117')
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://build-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
      NEXT_TELEMETRY_DISABLED: 1
      BA_BROWSER_BASE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated Chromium test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run local Next.js server and responsive browser tests
        run: |
          npm run start -- -p 3100 > /tmp/bantay-next.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3100/pre-register > /dev/null; then break; fi
            sleep 2
          done
          node tests/browser/visitor-mobile.cjs
