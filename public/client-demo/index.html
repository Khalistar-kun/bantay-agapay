<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7d1425"><title>Bantay-Agapay | Visitor Monitoring</title>
<meta name="description" content="Bantay-Agapay visitor registration and campus gate management">
<link rel="icon" href="/client-demo/bantay-agapay-logo.png">
<link rel="preload" href="/client-demo/bantay-agapay-logo.png" as="image">
<link rel="stylesheet" href="/client-demo/intro.css">
<link rel="stylesheet" href="/client-demo/style.css">
</head>
<body>
<!-- A cinematic, logo-led opening; replayed on each full load with no session tracking. -->
<div id="ba-splash" class="ba-splash" aria-hidden="true">
  <div class="ba-splash-aurora"></div>
  <div class="ba-splash-grid"></div>
  <div id="ba-splash-stars" class="ba-splash-stars"></div>
  <div class="ba-splash-beam"></div>
  <div class="ba-splash-rings">
    <span class="ba-ring ba-ring-one"></span>
    <span class="ba-ring ba-ring-two"></span>
    <span class="ba-ring ba-ring-three"></span>
  </div>
  <div class="ba-splash-mark">
    <span class="ba-splash-mark-glow"></span>
    <img src="/client-demo/bantay-agapay-logo.png" alt="" class="ba-splash-logo" fetchpriority="high" decoding="async">
    <span class="ba-splash-sheen"></span>
  </div>
  <span class="ba-splash-wave ba-wave-one"></span>
  <span class="ba-splash-wave ba-wave-two"></span>
  <span class="ba-splash-last-light"></span>
</div>
<div id="app"></div><div id="toast" role="status" aria-live="polite"></div>
<script src="/client-demo/qrcode-offline.js"></script>
<script src="/client-demo/script.js"></script>
<script src="/client-demo/intro.js"></script>
</body>
</html>
