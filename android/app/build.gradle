plugins { id 'com.android.application' }

def serverFile = file('../../mobile/server.json')
def serverConfig = new groovy.json.JsonSlurper().parse(serverFile)
def serverUrl = System.getenv('MOBILE_SERVER_URL') ?: serverConfig.url
if (serverUrl && !serverUrl.startsWith('https://')) {
    throw new GradleException('The Android server must use HTTPS.')
}

android {
    namespace 'ph.afgbmts.bantayagapay'
    compileSdk 35
    defaultConfig {
        applicationId 'ph.afgbmts.bantayagapay'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        buildConfigField 'String', 'SERVER_URL', groovy.json.JsonOutput.toJson(serverUrl ?: '')
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
